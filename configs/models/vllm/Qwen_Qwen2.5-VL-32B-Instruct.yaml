# Qwen2.5-VL-32B-Instruct (vLLM, OpenAI-Compatible)
# Vision-Language multimodal model - backbone for Lingshu-32B

metadata:
  release_date: "2025-02-19"
  model_size: 32                        # total=34.14B (llm=33.46B, vision=0.68B)
  context_window: 32768
  max_output_tokens: null
  modality: "vlm"
  is_reasoning: false
  huggingface_url: "https://huggingface.co/Qwen/Qwen2.5-VL-32B-Instruct"

model:
  name: Qwen/Qwen2.5-VL-32B-Instruct
  client: openai
  engine: vllm
  base_url: http://localhost:8000/v1
  api_key_env: EMPTY
  is_vlm: true

  params:
    max_tokens: 8192
    temperature: 0.0

vllm:
  gpu_memory_utilization: 0.9
  visible_devices: "0"
  port: 8000
  host: 0.0.0.0
  max_model_len: 32768
