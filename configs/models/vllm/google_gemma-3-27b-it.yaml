# Gemma-3-27B-IT (vLLM, OpenAI-Compatible)
# Vision-Language multimodal model with instruction tuning

metadata:
  release_date: "2025-03-12"
  model_size: 27                        # total=27.4B (llm=26.98B, vision=0.42B)
  context_window: 128000
  max_output_tokens: 8192
  modality: "vlm"
  is_reasoning: false
  huggingface_url: "https://huggingface.co/google/gemma-3-27b-it"

model:
  name: google/gemma-3-27b-it
  client: openai
  engine: vllm
  base_url: http://localhost:8000/v1
  api_key_env: EMPTY
  is_vlm: true

  params:
    max_tokens: 8192
    temperature: 0.0

vllm:
  gpu_memory_utilization: 0.9
  visible_devices: "0"
  port: 8000
  host: 0.0.0.0
  max_model_len: 32768
